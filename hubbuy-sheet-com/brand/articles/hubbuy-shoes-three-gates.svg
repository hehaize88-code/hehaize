<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy shoes three-gate decision record</title>
  <desc id="desc">A three-stage editorial diagram connecting sizing evidence, warehouse QC and packed parcel data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#072e35"/>
      <stop offset="1" stop-color="#0d5051"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00191c" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1070" cy="70" r="170" fill="#74d9c8" opacity=".09"/>
  <circle cx="90" cy="610" r="210" fill="#ffb26b" opacity=".08"/>
  <text x="72" y="90" fill="#83e2d2" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="4">HUBBUY SHOES GUIDE</text>
  <text x="72" y="155" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800">Three evidence gates before shipping</text>
  <path d="M230 340H970" stroke="#8ddfd3" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="300" height="245" rx="28" fill="#ffffff"/>
    <rect x="450" y="230" width="300" height="245" rx="28" fill="#ffffff"/>
    <rect x="830" y="230" width="300" height="245" rx="28" fill="#ffffff"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <circle cx="120" cy="280" r="27" fill="#ed7a4d"/>
    <text x="120" y="290" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="800">1</text>
    <text x="165" y="291" fill="#0b393e" font-size="30" font-weight="800">SIZE</text>
    <text x="105" y="350" fill="#24575a" font-size="24" font-weight="700">Foot + known shoe</text>
    <text x="105" y="390" fill="#4e6f71" font-size="20">Exact model and chart</text>
    <text x="105" y="425" fill="#4e6f71" font-size="20">Named measurement field</text>

    <circle cx="500" cy="280" r="27" fill="#ed7a4d"/>
    <text x="500" y="290" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="800">2</text>
    <text x="545" y="291" fill="#0b393e" font-size="30" font-weight="800">QC</text>
    <text x="485" y="350" fill="#24575a" font-size="24" font-weight="700">Pair + label match</text>
    <text x="485" y="390" fill="#4e6f71" font-size="20">Shape and visible condition</text>
    <text x="485" y="425" fill="#4e6f71" font-size="20">Clear ruler endpoints</text>

    <circle cx="880" cy="280" r="27" fill="#ed7a4d"/>
    <text x="880" y="290" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="800">3</text>
    <text x="925" y="291" fill="#0b393e" font-size="30" font-weight="800">PARCEL</text>
    <text x="865" y="350" fill="#24575a" font-size="24" font-weight="700">Packing state</text>
    <text x="865" y="390" fill="#4e6f71" font-size="20">Actual weight + dimensions</text>
    <text x="865" y="425" fill="#4e6f71" font-size="20">Current route result</text>
  </g>
  <text x="72" y="555" fill="#d6f5ef" font-family="Arial,Helvetica,sans-serif" font-size="23">A label is not a fit test. An item weight is not a parcel quote.</text>
</svg>
