<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy product link troubleshooting flow</title>
  <desc id="desc">An original editorial diagram showing the sequence source page, final URL, Hubbuy import and manual order evidence.</desc>
  <rect width="1200" height="630" fill="#071d19"/>
  <circle cx="1070" cy="90" r="210" fill="#143e34"/>
  <circle cx="1040" cy="115" r="126" fill="#ef7b45"/>
  <path d="M0 510 C230 430 410 590 660 500 C900 414 1040 500 1200 440 V630 H0Z" fill="#0e2e27"/>
  <text x="76" y="90" fill="#8ce1c2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">HUBBUY SHEET · TROUBLESHOOTING</text>
  <text x="76" y="165" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Product link not working?</text>
  <text x="76" y="216" fill="#d7eee6" font-family="Arial, Helvetica, sans-serif" font-size="25">Find the first broken handoff before changing the order.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 294)">
      <rect width="222" height="132" rx="18" fill="#ffffff"/>
      <text x="22" y="34" fill="#ef7b45" font-size="18" font-weight="800">01 · SOURCE</text>
      <text x="22" y="72" fill="#102b25" font-size="25" font-weight="800">Open the item</text>
      <text x="22" y="103" fill="#557169" font-size="17">Seller page still live?</text>
    </g>
    <text x="315" y="371" fill="#8ce1c2" font-size="34" font-weight="800">→</text>
    <g transform="translate(355 294)">
      <rect width="222" height="132" rx="18" fill="#ffffff"/>
      <text x="22" y="34" fill="#ef7b45" font-size="18" font-weight="800">02 · URL</text>
      <text x="22" y="72" fill="#102b25" font-size="25" font-weight="800">Copy final page</text>
      <text x="22" y="103" fill="#557169" font-size="17">Keep the item ID</text>
    </g>
    <text x="594" y="371" fill="#8ce1c2" font-size="34" font-weight="800">→</text>
    <g transform="translate(634 294)">
      <rect width="222" height="132" rx="18" fill="#ffffff"/>
      <text x="22" y="34" fill="#ef7b45" font-size="18" font-weight="800">03 · IMPORT</text>
      <text x="22" y="72" fill="#102b25" font-size="25" font-weight="800">Match details</text>
      <text x="22" y="103" fill="#557169" font-size="17">Title · image · option</text>
    </g>
    <text x="873" y="371" fill="#8ce1c2" font-size="34" font-weight="800">→</text>
    <g transform="translate(913 294)">
      <rect width="222" height="132" rx="18" fill="#f5a06f"/>
      <text x="22" y="34" fill="#102b25" font-size="18" font-weight="800">04 · MANUAL</text>
      <text x="22" y="72" fill="#102b25" font-size="25" font-weight="800">Submit evidence</text>
      <text x="22" y="103" fill="#173e35" font-size="17">Exact variant + price</text>
    </g>
  </g>
  <text x="76" y="550" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">TAOBAO · WEIDIAN · 1688</text>
  <text x="76" y="584" fill="#9fc4b7" font-family="Arial, Helvetica, sans-serif" font-size="17">Original editorial graphic · Independent guide · Not a Hubbuy interface screenshot</text>
</svg>
