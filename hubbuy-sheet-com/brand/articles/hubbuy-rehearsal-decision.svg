<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Rehearsal parcel decision map</title>
  <desc id="desc">A candidate parcel becomes packed evidence, which supports keeping one parcel or revising the plan.</desc>
  <rect width="1200" height="630" fill="#f6f1e7"/>
  <rect x="48" y="48" width="1104" height="534" rx="34" fill="#0d2b33"/>
  <text x="92" y="124" fill="#f6f1e7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">REHEARSAL DECISION</text>
  <text x="92" y="168" fill="#a8c8c4" font-family="Arial, sans-serif" font-size="20">Replace parcel assumptions with evidence tied to one defined plan.</text>
  <rect x="92" y="224" width="260" height="170" rx="24" fill="#f6f1e7"/>
  <text x="122" y="278" fill="#0d2b33" font-family="Arial, sans-serif" font-size="22" font-weight="700">Candidate parcel</text>
  <text x="122" y="320" fill="#365660" font-family="Arial, sans-serif" font-size="17">Exact items</text>
  <text x="122" y="350" fill="#365660" font-family="Arial, sans-serif" font-size="17">Packing constraints</text>
  <path d="M372 309h94" stroke="#e6b85c" stroke-width="9" stroke-linecap="round"/>
  <path d="M454 292l22 17-22 17" fill="none" stroke="#e6b85c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="492" y="224" width="280" height="170" rx="24" fill="#d8ebe7"/>
  <text x="522" y="278" fill="#0d2b33" font-family="Arial, sans-serif" font-size="22" font-weight="700">Packed evidence</text>
  <text x="522" y="320" fill="#365660" font-family="Arial, sans-serif" font-size="17">Weight · dimensions</text>
  <text x="522" y="350" fill="#365660" font-family="Arial, sans-serif" font-size="17">Routes · current quote</text>
  <path d="M792 309h58" stroke="#e6b85c" stroke-width="9" stroke-linecap="round"/>
  <path d="M842 309c55 0 34-78 72-78h18" fill="none" stroke="#e6b85c" stroke-width="7" stroke-linecap="round"/>
  <path d="M842 309c55 0 34 78 72 78h18" fill="none" stroke="#e6b85c" stroke-width="7" stroke-linecap="round"/>
  <rect x="932" y="185" width="180" height="92" rx="20" fill="#f6f1e7"/>
  <text x="958" y="228" fill="#0d2b33" font-family="Arial, sans-serif" font-size="20" font-weight="700">Keep combined</text>
  <text x="958" y="254" fill="#365660" font-family="Arial, sans-serif" font-size="14">Threshold satisfied</text>
  <rect x="932" y="341" width="180" height="92" rx="20" fill="#f6f1e7"/>
  <text x="958" y="384" fill="#0d2b33" font-family="Arial, sans-serif" font-size="20" font-weight="700">Split or revise</text>
  <text x="958" y="410" fill="#365660" font-family="Arial, sans-serif" font-size="14">Threshold crossed</text>
  <line x1="92" y1="468" x2="1112" y2="468" stroke="#34545d"/>
  <text x="92" y="518" fill="#f6f1e7" font-family="Arial, sans-serif" font-size="18">Write the trigger first:</text>
  <text x="292" y="518" fill="#e6b85c" font-family="Arial, sans-serif" font-size="18" font-weight="700">cost · route eligibility · protection</text>
</svg>
