<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy parcel tracking evidence map</title>
  <desc id="desc">Four-stage decision map for warehouse handoff, international transit, customs and last-mile delivery.</desc>
  <rect width="1200" height="630" fill="#f4efe5"/>
  <rect x="52" y="48" width="1096" height="534" rx="30" fill="#ffffff" stroke="#173f35" stroke-width="4"/>
  <text x="92" y="112" fill="#173f35" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">TRACKING EVIDENCE MAP</text>
  <text x="92" y="168" fill="#102b24" font-family="Arial, sans-serif" font-size="42" font-weight="800">Find the missing handoff.</text>
  <text x="92" y="208" fill="#5d6f68" font-family="Arial, sans-serif" font-size="21">One stage, one evidence record, one responsible party.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 268)">
      <rect width="235" height="220" rx="20" fill="#e8f2ed"/>
      <circle cx="34" cy="36" r="18" fill="#173f35"/>
      <text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">1</text>
      <text x="22" y="88" fill="#173f35" font-size="18" font-weight="800">WAREHOUSE</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Dispatch evidence</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Parcel number</text>
      <text x="22" y="178" fill="#5d6f68" font-size="15">Route + handoff</text>
      <text x="22" y="202" fill="#5d6f68" font-size="15">Carrier acceptance</text>
    </g>
    <g transform="translate(351 268)">
      <rect width="235" height="220" rx="20" fill="#fff1dc"/>
      <circle cx="34" cy="36" r="18" fill="#d76b2c"/>
      <text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <text x="22" y="88" fill="#8b3f17" font-size="18" font-weight="800">TRANSIT</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Last proven scan</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Event text</text>
      <text x="22" y="178" fill="#5d6f68" font-size="15">Time + location</text>
      <text x="22" y="202" fill="#5d6f68" font-size="15">Trace case</text>
    </g>
    <g transform="translate(610 268)">
      <rect width="235" height="220" rx="20" fill="#e7edf8"/>
      <circle cx="34" cy="36" r="18" fill="#325b93"/>
      <text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">3</text>
      <text x="22" y="88" fill="#244776" font-size="18" font-weight="800">CUSTOMS</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Request category</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Official notice</text>
      <text x="22" y="178" fill="#5d6f68" font-size="15">Documents + tax</text>
      <text x="22" y="202" fill="#5d6f68" font-size="15">Response record</text>
    </g>
    <g transform="translate(869 268)">
      <rect width="235" height="220" rx="20" fill="#efe7f5"/>
      <circle cx="34" cy="36" r="18" fill="#6f4a88"/>
      <text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">4</text>
      <text x="22" y="88" fill="#5b3873" font-size="18" font-weight="800">LAST MILE</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Delivery evidence</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Attempt + pickup</text>
      <text x="22" y="178" fill="#5d6f68" font-size="15">Address check</text>
      <text x="22" y="202" fill="#5d6f68" font-size="15">Proof of delivery</text>
    </g>
  </g>
  <path d="M327 378h24M586 378h24M845 378h24" stroke="#173f35" stroke-width="4" stroke-linecap="round"/>
  <text x="92" y="542" fill="#173f35" font-family="Arial, sans-serif" font-size="17" font-weight="700">Editorial guide • Checked 10 August 2026 • Not a live tracking result</text>
