<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy parcel insurance evidence map</title>
  <desc id="desc">Editorial map showing published parcel-loss cover, value and event evidence, and exclusions that still require risk control.</desc>
  <rect width="1200" height="630" fill="#f4efe6"/>
  <rect x="54" y="50" width="1092" height="530" rx="28" fill="#ffffff" stroke="#dbe5df" stroke-width="2"/>
  <text x="94" y="112" fill="#e26f33" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">PARCEL INSURANCE · EVIDENCE</text>
  <text x="94" y="168" fill="#173d2d" font-family="Arial, sans-serif" font-size="42" font-weight="800">Match the event before the claim</text>
  <text x="94" y="204" fill="#66776e" font-family="Arial, sans-serif" font-size="20">Coverage, value and records must describe the same parcel.</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="252" width="318" height="198" rx="18" fill="#eef7f2" stroke="#b9d7c7"/>
    <text x="120" y="292" fill="#2d6750" font-size="15" font-weight="700">01 · PUBLISHED COVER</text>
    <text x="120" y="338" fill="#173d2d" font-size="25" font-weight="800">LOSS EVENT</text>
    <text x="120" y="374" fill="#66776e" font-size="16">Parcel loss or defined</text>
    <text x="120" y="398" fill="#66776e" font-size="16">whole-parcel customs loss</text>
    <rect x="440" y="252" width="318" height="198" rx="18" fill="#edf3f7" stroke="#b9cdd8"/>
    <text x="466" y="292" fill="#426b80" font-size="15" font-weight="700">02 · PROOF FILE</text>
    <text x="466" y="338" fill="#173d2d" font-size="25" font-weight="800">VALUE + EVENT</text>
    <text x="466" y="374" fill="#66776e" font-size="16">Items, freight, insurance,</text>
    <text x="466" y="398" fill="#66776e" font-size="16">tracking and official notices</text>
    <rect x="786" y="252" width="320" height="198" rx="18" fill="#fff0ed" stroke="#e4bbb1"/>
    <text x="812" y="292" fill="#a6503e" font-size="15" font-weight="700">03 · EXCLUDED RISK</text>
    <text x="812" y="338" fill="#173d2d" font-size="25" font-weight="800">CONTROL SEPARATELY</text>
    <text x="812" y="374" fill="#66776e" font-size="16">Damage, delivered scan,</text>
    <text x="812" y="398" fill="#66776e" font-size="16">recipient and customs duties</text>
    <path d="M412 351h28M758 351h28" stroke="#e26f33" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="518" fill="#173d2d" font-size="20" font-weight="700">Live checkout terms control: save the wording before dispatch.</text>
    <text x="94" y="548" fill="#87938c" font-size="14">Original editorial map · Hubbuy Sheet · Checked 3 August 2026</text>
  </g>
</svg>
