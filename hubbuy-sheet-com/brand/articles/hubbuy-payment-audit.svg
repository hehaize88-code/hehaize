<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy payment audit map</title>
  <desc id="desc">A four-stage diagram connecting the Hubbuy charge, payment method, issuer posting and final cost audit.</desc>
  <rect width="1200" height="630" fill="#f3f0e8"/>
  <rect x="54" y="52" width="1092" height="526" rx="34" fill="#152b28"/>
  <text x="96" y="124" fill="#f6f2e7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">PAYMENT COST AUDIT</text>
  <text x="96" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Reconcile one charge across four records</text>
  <line x1="186" y1="355" x2="1014" y2="355" stroke="#6fd2b2" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(96 267)">
      <circle cx="90" cy="88" r="68" fill="#6fd2b2"/>
      <text x="90" y="82" text-anchor="middle" fill="#102724" font-size="19" font-weight="700">HUBBUY</text>
      <text x="90" y="108" text-anchor="middle" fill="#102724" font-size="15">amount + currency</text>
      <text x="90" y="195" text-anchor="middle" fill="#f6f2e7" font-size="17">01 · requested charge</text>
    </g>
    <g transform="translate(372 267)">
      <circle cx="90" cy="88" r="68" fill="#f1c75b"/>
      <text x="90" y="82" text-anchor="middle" fill="#2c2513" font-size="19" font-weight="700">METHOD</text>
      <text x="90" y="108" text-anchor="middle" fill="#2c2513" font-size="15">fee + conversion</text>
      <text x="90" y="195" text-anchor="middle" fill="#f6f2e7" font-size="17">02 · authorization</text>
    </g>
    <g transform="translate(648 267)">
      <circle cx="90" cy="88" r="68" fill="#f3a58f"/>
      <text x="90" y="82" text-anchor="middle" fill="#351a14" font-size="19" font-weight="700">ISSUER</text>
      <text x="90" y="108" text-anchor="middle" fill="#351a14" font-size="15">posted debit</text>
      <text x="90" y="195" text-anchor="middle" fill="#f6f2e7" font-size="17">03 · settlement</text>
    </g>
    <g transform="translate(924 267)">
      <circle cx="90" cy="88" r="68" fill="#d9d4f4"/>
      <text x="90" y="82" text-anchor="middle" fill="#241e3f" font-size="19" font-weight="700">AUDIT</text>
      <text x="90" y="108" text-anchor="middle" fill="#241e3f" font-size="15">rate + total</text>
      <text x="90" y="195" text-anchor="middle" fill="#f6f2e7" font-size="17">04 · reconcile</text>
    </g>
  </g>
  <text x="96" y="548" fill="#bcd0ca" font-family="Arial, Helvetica, sans-serif" font-size="18">Live screen → masked receipt → posted amount → observed exchange-rate cost</text>
</svg>
