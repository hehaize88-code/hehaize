  <text x="92" y="168" fill="#102b24" font-family="Arial, sans-serif" font-size="42" font-weight="800">Resolve the item before the parcel.</text>
  <text x="92" y="208" fill="#5d6f68" font-family="Arial, sans-serif" font-size="21">One mismatch, one evidence record, one confirmed outcome.</text>
  <g font-family="Arial, sans-serif">
