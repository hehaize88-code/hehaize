      <circle cx="34" cy="36" r="18" fill="#325b93"/><text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">3</text>
      <text x="22" y="88" fill="#244776" font-size="18" font-weight="800">CONFIRM</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Live remedy</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Seller response</text><text x="22" y="178" fill="#5d6f68" font-size="15">Cost + deadline</text><text x="22" y="202" fill="#5d6f68" font-size="15">Next event</text>
