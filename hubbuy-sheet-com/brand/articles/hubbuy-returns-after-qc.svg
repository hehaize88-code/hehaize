<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy returns after QC evidence map</title>
  <desc id="desc">Four-stage evidence map for matching an order, documenting a QC issue, confirming the remedy and closing the warehouse record.</desc>
