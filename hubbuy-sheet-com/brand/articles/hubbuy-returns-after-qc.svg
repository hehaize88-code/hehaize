      <text x="22" y="88" fill="#173f35" font-size="18" font-weight="800">MATCH</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Order identity</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">Source listing</text><text x="22" y="178" fill="#5d6f68" font-size="15">Selected option</text><text x="22" y="202" fill="#5d6f68" font-size="15">Quantity</text>
    </g>
    <g transform="translate(351 268)">
      <rect width="235" height="220" rx="20" fill="#fff1dc"/>
      <circle cx="34" cy="36" r="18" fill="#d76b2c"/><text x="34" y="43" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <text x="22" y="88" fill="#8b3f17" font-size="18" font-weight="800">PROVE</text>
      <text x="22" y="122" fill="#102b24" font-size="17" font-weight="700">Visible mismatch</text>
      <text x="22" y="154" fill="#5d6f68" font-size="15">QC image</text><text x="22" y="178" fill="#5d6f68" font-size="15">Exact observation</text><text x="22" y="202" fill="#5d6f68" font-size="15">Decision impact</text>
    </g>
