<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy reviews evidence matrix</title>
  <desc id="desc">Editorial matrix separating positive review patterns, cautions, one dispute and sample limitations.</desc>
  <rect width="1200" height="630" fill="#f5efe4"/>
  <rect x="54" y="50" width="1092" height="530" rx="28" fill="#fff" stroke="#dce5df" stroke-width="2"/>
  <text x="94" y="112" fill="#e26f33" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">REVIEW ANALYSIS · 2026</text>
  <text x="94" y="168" fill="#173d2d" font-family="Arial, sans-serif" font-size="42" font-weight="800">Hubbuy Reviews: Read the Evidence</text>
  <text x="94" y="204" fill="#66776e" font-family="Arial, sans-serif" font-size="20">Patterns are useful only when sample limits stay visible.</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="254" width="488" height="116" rx="18" fill="#eef7f2" stroke="#b9d7c7"/>
    <rect x="94" y="254" width="8" height="116" rx="4" fill="#2d6750"/>
    <text x="128" y="291" fill="#2d6750" font-size="15" font-weight="700">REPEATED POSITIVE</text>
    <text x="128" y="330" fill="#173d2d" font-size="25" font-weight="800">Support · Packaging · QC</text>
    <text x="128" y="354" fill="#66776e" font-size="15">Recurring themes in the visible public sample</text>
    <rect x="618" y="254" width="488" height="116" rx="18" fill="#fff5ec" stroke="#efd0b9"/>
    <rect x="618" y="254" width="8" height="116" rx="4" fill="#e58c55"/>
    <text x="652" y="291" fill="#b45e2d" font-size="15" font-weight="700">CAUTION SIGNALS</text>
    <text x="652" y="330" fill="#173d2d" font-size="25" font-weight="800">Cost · Routes · Delays</text>
    <text x="652" y="354" fill="#66776e" font-size="15">Questions to resolve for the exact parcel</text>
    <rect x="94" y="392" width="488" height="116" rx="18" fill="#fff2ef" stroke="#e3c0b8"/>
    <rect x="94" y="392" width="8" height="116" rx="4" fill="#a65e4b"/>
    <text x="128" y="429" fill="#9a4f3e" font-size="15" font-weight="700">ISOLATED DISPUTE</text>
    <text x="128" y="468" fill="#173d2d" font-size="25" font-weight="800">Electronics · After-sales</text>
    <text x="128" y="492" fill="#66776e" font-size="15">One allegation is not a platform-wide rate</text>
    <rect x="618" y="392" width="488" height="116" rx="18" fill="#f1f3f2" stroke="#cfd7d2"/>
    <rect x="618" y="392" width="8" height="116" rx="4" fill="#76867d"/>
    <text x="652" y="429" fill="#596860" font-size="15" font-weight="700">SAMPLE LIMIT</text>
    <text x="652" y="468" fill="#173d2d" font-size="25" font-weight="800">Voluntary · Region-skewed</text>
    <text x="652" y="492" fill="#66776e" font-size="15">A snapshot, not a customer census</text>
    <text x="94" y="548" fill="#87938c" font-size="14">Original editorial evidence map · Hubbuy Sheet · Checked 28 July 2026</text>
  </g>
</svg>
