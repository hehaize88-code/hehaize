<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy seller reliability evidence chain</title>
  <desc id="desc">A three-stage evidence map connecting the saved listing, domestic dispatch and warehouse match.</desc>
  <rect width="1200" height="630" fill="#08152f"/>
  <rect x="54" y="50" width="1092" height="530" rx="34" fill="#0f2349" stroke="#5b82d6" stroke-width="2"/>
  <text x="100" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Seller evidence chain</text>
  <text x="100" y="169" fill="#b9c9e8" font-family="Arial, Helvetica, sans-serif" font-size="24">Connect each claim to a dated order event.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="100" y="235" width="284" height="196" rx="22" fill="#16366e" stroke="#7ea4f2" stroke-width="2"/>
    <text x="128" y="282" fill="#8fb3ff" font-size="19" font-weight="700">01 · SAVE</text>
    <text x="128" y="330" fill="#ffffff" font-size="29" font-weight="700">Listing evidence</text>
    <text x="128" y="370" fill="#d8e4fa" font-size="20">Seller · item · option</text>
    <text x="128" y="400" fill="#d8e4fa" font-size="20">Terms · check time</text>
    <path d="M406 333h52" stroke="#8fb3ff" stroke-width="8" stroke-linecap="round"/>
    <path d="m448 315 22 18-22 18" fill="none" stroke="#8fb3ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="474" y="235" width="252" height="196" rx="22" fill="#124965" stroke="#67c0d6" stroke-width="2"/>
    <text x="502" y="282" fill="#7ed5e8" font-size="19" font-weight="700">02 · TRACE</text>
    <text x="502" y="330" fill="#ffffff" font-size="29" font-weight="700">Seller dispatch</text>
    <text x="502" y="370" fill="#d6f2f6" font-size="20">Actionable time</text>
    <text x="502" y="400" fill="#d6f2f6" font-size="20">Carrier event</text>
    <path d="M748 333h52" stroke="#70d5bd" stroke-width="8" stroke-linecap="round"/>
    <path d="m790 315 22 18-22 18" fill="none" stroke="#70d5bd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="816" y="235" width="284" height="196" rx="22" fill="#145748" stroke="#75dabf" stroke-width="2"/>
    <text x="844" y="282" fill="#86e8cf" font-size="19" font-weight="700">03 · COMPARE</text>
    <text x="844" y="330" fill="#ffffff" font-size="29" font-weight="700">Warehouse match</text>
    <text x="844" y="370" fill="#d9f7ee" font-size="20">Identity · quantity</text>
    <text x="844" y="400" fill="#d9f7ee" font-size="20">Visible condition</text>
    <rect x="100" y="478" width="1000" height="58" rx="16" fill="#091b39"/>
    <text x="600" y="515" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">A dated order record—not a permanent seller rating</text>
  </g>
</svg>
