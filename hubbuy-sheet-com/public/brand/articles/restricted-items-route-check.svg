<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hubbuy restricted-items route check</title>
  <desc id="desc">Editorial decision map for prohibited goods, dangerous goods, route-limited goods and destination checks.</desc>
  <rect width="1200" height="630" fill="#f5efe4"/>
  <rect x="54" y="50" width="1092" height="530" rx="28" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
  <text x="94" y="112" fill="#e26f33" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">RESTRICTED ITEMS · 2026</text>
  <text x="94" y="168" fill="#173d2d" font-family="Arial, sans-serif" font-size="42" font-weight="800">Check the item before the route</text>
  <text x="94" y="204" fill="#66776e" font-family="Arial, sans-serif" font-size="20">Eligibility is a chain: product → transport → route → destination.</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="252" width="238" height="198" rx="18" fill="#fff0ed" stroke="#e4bbb1"/>
    <text x="120" y="292" fill="#a6503e" font-size="15" font-weight="700">01 · PROHIBITED</text>
    <text x="120" y="340" fill="#173d2d" font-size="26" font-weight="800">STOP</text>
    <text x="120" y="376" fill="#66776e" font-size="16">Do not buy for</text>
    <text x="120" y="400" fill="#66776e" font-size="16">international dispatch</text>
    <rect x="354" y="252" width="238" height="198" rx="18" fill="#fff7e9" stroke="#ead4ad"/>
    <text x="380" y="292" fill="#a26b21" font-size="15" font-weight="700">02 · DANGEROUS</text>
    <text x="380" y="340" fill="#173d2d" font-size="26" font-weight="800">CLASSIFY</text>
    <text x="380" y="376" fill="#66776e" font-size="16">Disclose batteries,</text>
    <text x="380" y="400" fill="#66776e" font-size="16">liquids and hazards</text>
    <rect x="614" y="252" width="238" height="198" rx="18" fill="#eef7f2" stroke="#b9d7c7"/>
    <text x="640" y="292" fill="#2d6750" font-size="15" font-weight="700">03 · ROUTE-LIMITED</text>
    <text x="640" y="340" fill="#173d2d" font-size="26" font-weight="800">VERIFY</text>
    <text x="640" y="376" fill="#66776e" font-size="16">Use the live product</text>
    <text x="640" y="400" fill="#66776e" font-size="16">and destination result</text>
    <rect x="874" y="252" width="232" height="198" rx="18" fill="#edf3f7" stroke="#b9cdd8"/>
    <text x="900" y="292" fill="#426b80" font-size="15" font-weight="700">04 · DESTINATION</text>
    <text x="900" y="340" fill="#173d2d" font-size="26" font-weight="800">CONFIRM</text>
    <text x="900" y="376" fill="#66776e" font-size="16">Customs and import</text>
    <text x="900" y="400" fill="#66776e" font-size="16">rules still apply</text>
    <path d="M332 351h22M592 351h22M852 351h22" stroke="#e26f33" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="518" fill="#173d2d" font-size="20" font-weight="700">No live eligible route = do not place the item in the parcel.</text>
    <text x="94" y="548" fill="#87938c" font-size="14">Original editorial decision map · Hubbuy Sheet · Checked 30 July 2026</text>
  </g>
</svg>
