<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#efe5d7"/>
  <rect x="44" y="40" width="1112" height="550" rx="24" fill="#fffdf7" stroke="#171513" stroke-width="3"/>
  <text x="82" y="92" fill="#b7342c" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">CUSTOMER EVIDENCE · LOLOBUY SHEET</text>
  <text x="82" y="164" fill="#171513" font-family="Georgia, serif" font-size="56">A useful review separates</text>
  <text x="82" y="226" fill="#171513" font-family="Georgia, serif" font-size="56">tested from still unknown.</text>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="292" width="316" height="214" rx="16" fill="#dcecc6"/>
    <text x="108" y="334" fill="#b7342c" font-size="18" font-weight="700">TESTED IN THE REPORT</text>
    <text x="108" y="382" fill="#171513" font-size="26" font-weight="700">Purchase + warehouse</text>
    <text x="108" y="420" fill="#5c554e" font-size="19">Navigation, QC images,</text>
    <text x="108" y="448" fill="#5c554e" font-size="19">support and one return.</text>
    <rect x="442" y="292" width="316" height="214" rx="16" fill="#f2d2cd"/>
    <text x="468" y="334" fill="#b7342c" font-size="18" font-weight="700">NOT YET TESTED</text>
    <text x="468" y="382" fill="#171513" font-size="26" font-weight="700">International outcome</text>
    <text x="468" y="420" fill="#5c554e" font-size="19">Final freight, tracking,</text>
    <text x="468" y="448" fill="#5c554e" font-size="19">customs and delivery.</text>
    <rect x="802" y="292" width="316" height="214" rx="16" fill="#d7e4ee"/>
    <text x="828" y="334" fill="#b7342c" font-size="18" font-weight="700">FAIR CONCLUSION</text>
    <text x="828" y="382" fill="#171513" font-size="26" font-weight="700">Early signal only</text>
    <text x="828" y="420" fill="#5c554e" font-size="19">One preliminary case,</text>
    <text x="828" y="448" fill="#5c554e" font-size="19">not a universal score.</text>
  </g>
  <text x="82" y="550" fill="#5c554e" font-family="Arial, sans-serif" font-size="18">Disclose incentives · preserve dates · document the delivered parcel</text>
</svg>
