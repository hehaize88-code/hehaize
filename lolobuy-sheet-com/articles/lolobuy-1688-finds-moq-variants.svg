<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">1688 offer verification diagram</title>
  <desc id="desc">A four-part decision path connecting quantity, pricing unit, selected SKU and evidence before a LoloBuy order.</desc>
  <rect width="1200" height="630" fill="#f6f2e8"/><rect x="62" y="62" width="1076" height="506" rx="34" fill="#111b2e"/>
  <text x="112" y="145" fill="#f4b942" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">1688 OFFER CHECK</text>
  <text x="112" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Read the whole order equation.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(112 270)"><rect width="210" height="190" rx="20" fill="#1d2b45"/><text x="24" y="46" fill="#f4b942" font-size="18" font-weight="700">01 QUANTITY</text><text x="24" y="88" fill="#fff" font-size="24" font-weight="700">Minimum + count</text><text x="24" y="126" fill="#bec8d9" font-size="17">Use the tier that</text><text x="24" y="151" fill="#bec8d9" font-size="17">matches your order.</text></g>
    <g transform="translate(368 270)"><rect width="210" height="190" rx="20" fill="#1d2b45"/><text x="24" y="46" fill="#f4b942" font-size="18" font-weight="700">02 UNIT</text><text x="24" y="88" fill="#fff" font-size="24" font-weight="700">Piece or pack?</text><text x="24" y="126" fill="#bec8d9" font-size="17">Never calculate</text><text x="24" y="151" fill="#bec8d9" font-size="17">before this is clear.</text></g>
    <g transform="translate(624 270)"><rect width="210" height="190" rx="20" fill="#1d2b45"/><text x="24" y="46" fill="#f4b942" font-size="18" font-weight="700">03 SKU</text><text x="24" y="88" fill="#fff" font-size="24" font-weight="700">Exact option</text><text x="24" y="126" fill="#bec8d9" font-size="17">Color, size, model,</text><text x="24" y="151" fill="#bec8d9" font-size="17">bundle and pieces.</text></g>
    <g transform="translate(880 270)"><rect width="210" height="190" rx="20" fill="#1d2b45"/><text x="24" y="46" fill="#f4b942" font-size="18" font-weight="700">04 EVIDENCE</text><text x="24" y="88" fill="#fff" font-size="24" font-weight="700">Save the trail</text><text x="24" y="126" fill="#bec8d9" font-size="17">Listing, order and</text><text x="24" y="151" fill="#bec8d9" font-size="17">warehouse record.</text></g>
  </g>
  <text x="112" y="520" fill="#bec8d9" font-family="Arial,sans-serif" font-size="20">Independent decision diagram · Verify every live listing before payment</text>
</svg>
