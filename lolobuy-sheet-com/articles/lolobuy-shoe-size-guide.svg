<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Shoe sizing measurement evidence diagram</title>
  <desc id="desc">A four-step diagram connecting foot length, a reference insole, the seller measurement table and warehouse verification.</desc>
  <rect width="1200" height="630" fill="#f3efe6"/>
  <rect x="44" y="44" width="1112" height="542" rx="34" fill="#171813"/>
  <text x="92" y="118" fill="#f5f0e5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">LOLOBUY SHOE SIZE GUIDE</text>
  <text x="92" y="176" fill="#f5f0e5" font-family="Arial, sans-serif" font-size="42" font-weight="700">Measure first. Verify the pair later.</text>
  <line x1="110" y1="342" x2="1090" y2="342" stroke="#8f957c" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 232)">
      <circle cx="78" cy="110" r="68" fill="#d8b66a"/>
      <path d="M59 62c18-11 42 2 46 26 4 21 2 50 17 66 8 10 3 27-10 31-24 8-59-5-71-29-13-27-6-79 18-94Z" fill="#171813"/>
      <text x="0" y="224" fill="#f5f0e5" font-size="23" font-weight="700">1  FOOT</text>
      <text x="0" y="257" fill="#bfc3af" font-size="17">Longer standing length</text>
    </g>
    <g transform="translate(352 232)">
      <circle cx="78" cy="110" r="68" fill="#b9c2a6"/>
      <path d="M45 62c28-13 70 7 72 40l4 69c-26 13-72 9-93-11l7-77c1-9 4-16 10-21Z" fill="none" stroke="#171813" stroke-width="9"/>
      <line x1="52" y1="78" x2="96" y2="157" stroke="#171813" stroke-width="5"/>
      <text x="0" y="224" fill="#f5f0e5" font-size="23" font-weight="700">2  INSOLE</text>
      <text x="0" y="257" fill="#bfc3af" font-size="17">Known comfortable reference</text>
    </g>
    <g transform="translate(612 232)">
      <circle cx="78" cy="110" r="68" fill="#9eb9bd"/>
      <rect x="34" y="62" width="88" height="96" rx="8" fill="#171813"/>
      <line x1="49" y1="86" x2="107" y2="86" stroke="#f3efe6" stroke-width="6"/>
      <line x1="49" y1="108" x2="96" y2="108" stroke="#f3efe6" stroke-width="6"/>
      <line x1="49" y1="130" x2="106" y2="130" stroke="#f3efe6" stroke-width="6"/>
      <text x="0" y="224" fill="#f5f0e5" font-size="23" font-weight="700">3  LISTING</text>
      <text x="0" y="257" fill="#bfc3af" font-size="17">Definition, units, option</text>
    </g>
    <g transform="translate(872 232)">
      <circle cx="78" cy="110" r="68" fill="#d59c7f"/>
      <path d="M28 126c28 0 40-7 59-37l19 20c14 15 29 22 45 25l-8 29H34Z" fill="#171813"/>
      <path d="M93 81l19-13 20 16" fill="none" stroke="#171813" stroke-width="8" stroke-linecap="round"/>
      <text x="0" y="224" fill="#f5f0e5" font-size="23" font-weight="700">4  WAREHOUSE</text>
      <text x="0" y="257" fill="#bfc3af" font-size="17">Label, pair, decisive check</text>
    </g>
