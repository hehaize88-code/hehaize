  <text x="82" y="92" fill="#b7342c" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">QC PHOTO CHECKLIST · LOLOBUY SHEET</text>
  <text x="82" y="164" fill="#171513" font-family="Georgia, serif" font-size="56">Read the evidence</text>
  <text x="82" y="226" fill="#171513" font-family="Georgia, serif" font-size="56">in a repeatable order.</text>
  <g font-family="Arial, sans-serif">
    <line x1="138" y1="338" x2="1060" y2="338" stroke="#b7342c" stroke-width="8"/>
    <circle cx="148" cy="338" r="38" fill="#dcecc6" stroke="#171513" stroke-width="3"/>
    <circle cx="448" cy="338" r="38" fill="#efe5d7" stroke="#171513" stroke-width="3"/>
    <circle cx="748" cy="338" r="38" fill="#f2d2cd" stroke="#171513" stroke-width="3"/>
    <circle cx="1048" cy="338" r="38" fill="#d7e4ee" stroke="#171513" stroke-width="3"/>
    <text x="137" y="347" font-size="26" font-weight="700">1</text>
    <text x="437" y="347" font-size="26" font-weight="700">2</text>
    <text x="737" y="347" font-size="26" font-weight="700">3</text>
    <text x="1037" y="347" font-size="26" font-weight="700">4</text>
    <text x="82" y="414" fill="#171513" font-size="27" font-weight="700">Identity</text>
    <text x="82" y="448" fill="#5c554e" font-size="19">Item, colour, size,</text>
    <text x="82" y="476" fill="#5c554e" font-size="19">quantity and pieces.</text>
    <text x="382" y="414" fill="#171513" font-size="27" font-weight="700">Structure</text>
    <text x="382" y="448" fill="#5c554e" font-size="19">Shape, symmetry,</text>
    <text x="382" y="476" fill="#5c554e" font-size="19">seams and damage.</text>
    <text x="682" y="414" fill="#171513" font-size="27" font-weight="700">Measurements</text>
    <text x="682" y="448" fill="#5c554e" font-size="19">Ruler position and</text>
    <text x="682" y="476" fill="#5c554e" font-size="19">fit-critical values.</text>
    <text x="952" y="414" fill="#171513" font-size="27" font-weight="700">Action</text>
    <text x="952" y="448" fill="#5c554e" font-size="18">Accept, clarify or</text>
