<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f3efe5"/>
  <rect x="44" y="40" width="1112" height="550" rx="24" fill="#fffdf7" stroke="#171513" stroke-width="3"/>
  <text x="82" y="92" fill="#b7342c" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">LOLOBUY SHEET · EDITORIAL GUIDE</text>
  <text x="82" y="164" fill="#171513" font-family="Georgia, serif" font-size="56">A spreadsheet is the start,</text>
  <text x="82" y="226" fill="#171513" font-family="Georgia, serif" font-size="56">not the final proof.</text>
  <line x1="82" y1="266" x2="1118" y2="266" stroke="#171513" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="302" width="238" height="196" rx="14" fill="#dcecc6"/>
    <text x="104" y="342" fill="#b7342c" font-size="18" font-weight="700">01 · DISCOVER</text>
    <text x="104" y="390" fill="#171513" font-size="23" font-weight="700">Find a product</text>
    <text x="104" y="426" fill="#171513" font-size="20">Category, use,</text>
    <text x="104" y="454" fill="#171513" font-size="20">material and budget.</text>
    <rect x="344" y="302" width="238" height="196" rx="14" fill="#efe5d7"/>
    <text x="366" y="342" fill="#b7342c" font-size="18" font-weight="700">02 · VERIFY</text>
    <text x="366" y="390" fill="#171513" font-size="23" font-weight="700">Check the listing</text>
    <text x="366" y="426" fill="#171513" font-size="20">Variant, seller,</text>
    <text x="366" y="454" fill="#171513" font-size="20">price and availability.</text>
    <rect x="606" y="302" width="238" height="196" rx="14" fill="#f2d2cd"/>
    <text x="628" y="342" fill="#b7342c" font-size="18" font-weight="700">03 · INSPECT</text>
    <text x="628" y="390" fill="#171513" font-size="23" font-weight="700">Read warehouse QC</text>
    <text x="628" y="426" fill="#171513" font-size="20">Identity, condition,</text>
    <text x="628" y="454" fill="#171513" font-size="20">measurements and limits.</text>
    <rect x="868" y="302" width="250" height="196" rx="14" fill="#d7e4ee"/>
    <text x="890" y="342" fill="#b7342c" font-size="18" font-weight="700">04 · SHIP</text>
    <text x="890" y="390" fill="#171513" font-size="23" font-weight="700">Use parcel data</text>
    <text x="890" y="426" fill="#171513" font-size="20">Packed weight, size,</text>
    <text x="890" y="454" fill="#171513" font-size="20">route and destination.</text>
  </g>
  <text x="82" y="550" fill="#5c554e" font-family="Arial, sans-serif" font-size="18">Independent guide · live listings and account terms remain controlling</text>
</svg>
