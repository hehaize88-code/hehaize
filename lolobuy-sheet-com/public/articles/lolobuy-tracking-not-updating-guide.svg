<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Last-scan method for a parcel tracking delay</title>
  <desc id="desc">A four-stage editorial diagram showing record, locate, classify and escalate around a parcel route.</desc>
  <rect width="1200" height="630" fill="#f4efe6"/>
  <path d="M0 58h1200M0 572h1200" stroke="#d8cdbd" stroke-width="2"/>
  <text x="72" y="111" fill="#ff3b2f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">PARCEL EVIDENCE / LAST-SCAN METHOD</text>
  <text x="72" y="175" fill="#171512" font-family="Georgia, 'Times New Roman', serif" font-size="42">Follow the evidence, not the refresh button.</text>
  <path d="M116 338H1084" stroke="#171512" stroke-width="3"/>
  <path d="M1084 338l-18-11v22z" fill="#171512"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 254)">
      <rect width="236" height="182" fill="#fffdf8" stroke="#b9ad9d" stroke-width="2"/>
      <circle cx="44" cy="84" r="22" fill="#ff3b2f"/>
      <text x="44" y="91" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">01</text>
      <text x="27" y="36" fill="#6f6559" font-size="13" font-weight="700" letter-spacing="2">RECORD</text>
      <text x="27" y="130" fill="#171512" font-size="22" font-weight="700">Save the shipment.</text>
      <text x="27" y="157" fill="#5c544b" font-size="15">ID · route · dispatch · address</text>
    </g>
    <g transform="translate(342 254)">
      <rect width="236" height="182" fill="#fffdf8" stroke="#b9ad9d" stroke-width="2"/>
      <circle cx="44" cy="84" r="22" fill="#ff3b2f"/>
      <text x="44" y="91" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">02</text>
      <text x="27" y="36" fill="#6f6559" font-size="13" font-weight="700" letter-spacing="2">LOCATE</text>
      <text x="27" y="130" fill="#171512" font-size="22" font-weight="700">Find the last scan.</text>
      <text x="27" y="157" fill="#5c544b" font-size="15">time · place · responsible carrier</text>
    </g>
    <g transform="translate(612 254)">
      <rect width="236" height="182" fill="#fffdf8" stroke="#b9ad9d" stroke-width="2"/>
      <circle cx="44" cy="84" r="22" fill="#ff3b2f"/>
      <text x="44" y="91" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">03</text>
      <text x="27" y="36" fill="#6f6559" font-size="13" font-weight="700" letter-spacing="2">CLASSIFY</text>
      <text x="27" y="130" fill="#171512" font-size="22" font-weight="700">Name the stage.</text>
      <text x="27" y="157" fill="#5c544b" font-size="15">label · handoff · customs · delivery</text>
    </g>
    <g transform="translate(882 254)">
      <rect width="236" height="182" fill="#171512" stroke="#171512" stroke-width="2"/>
      <circle cx="44" cy="84" r="22" fill="#ff3b2f"/>
      <text x="44" y="91" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">04</text>
      <text x="27" y="36" fill="#ff8a82" font-size="13" font-weight="700" letter-spacing="2">ESCALATE</text>
      <text x="27" y="130" fill="#fffdf8" font-size="22" font-weight="700">Ask one clear question.</text>
      <text x="27" y="157" fill="#d8cdbd" font-size="15">event · elapsed time · next check</text>
    </g>
  </g>
  <text x="72" y="526" fill="#6f6559" font-family="Arial, Helvetica, sans-serif" font-size="16">Independent editorial process diagram · Facts and carrier terms require a live check.</text>
</svg>
