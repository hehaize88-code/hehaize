name: Refresh Kakobuy Pick image index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kakobuypick-image-index.yml'
      - 'kakobuypick-com/scripts/refresh-image-index.py'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kakobuypick-image-index
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kakobuypick-com/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13' 'httpx>=0.28,<0.29'
      - run: python kakobuypick-com/scripts/refresh-image-index.py --discover "$RUNNER_TEMP/visual-catalog.json"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-catalog
          path: ${{ runner.temp }}/visual-catalog.json
          retention-days: 1
  measure:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kakobuypick-com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13' 'httpx>=0.28,<0.29'
      - uses: actions/download-artifact@v4
        with:
          name: visual-catalog
          path: ${{ runner.temp }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kakobuypick-images/
          key: kakobuypick-images-v2-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: kakobuypick-images-v2-${{ matrix.lane }}-
      - name: Measure new photos and check SKU galleries
        working-directory: kakobuypick-com
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python scripts/refresh-image-index.py --cache-dir ~/.cache/kakobuypick-images \
            --inventory "$RUNNER_TEMP/visual-catalog.json" --lane "$LANE" --patch "$RUNNER_TEMP/lane-$LANE.gz" \
            --limit 750 --max-images 30000 --reaudit 30 --budget 85
      - uses: actions/upload-artifact@v4
        with:
          name: visual-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-${{ matrix.lane }}.gz
          retention-days: 1
  publish:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kakobuypick-com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13' 'httpx>=0.28,<0.29'
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - run: python kakobuypick-com/scripts/refresh-image-index.py --inventory "$RUNNER_TEMP/patches/visual-catalog.json" --merge "$RUNNER_TEMP/patches"
      - name: Publish changed Kakobuy Pick signatures
        run: |
          git add -- kakobuypick-com/public/image-index kakobuypick-com/src/lib/visual/manifest.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Kakobuy Pick image index'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
