<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Size measurement QC evidence diagram</title><desc id="desc">A measurement path from defined endpoints through visible ruler placement and like-for-like comparison to a bounded decision.</desc>
  <rect width="1200" height="630" fill="#f5f1e8"/><rect x="58" y="58" width="1084" height="514" rx="34" fill="#18251f"/>
  <text x="108" y="142" fill="#8ee0bd" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="3">SIZE-MEASUREMENT QC</text><text x="108" y="202" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="700">A number is only as good as its method.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(108 270)"><circle cx="42" cy="42" r="42" fill="#8ee0bd"/><text x="27" y="51" fill="#18251f" font-size="28" font-weight="700">1</text><text x="0" y="118" fill="#fff" font-size="22" font-weight="700">Define endpoints</text><text x="0" y="150" fill="#c8d5cf" font-size="17">Start, finish and path.</text></g><g transform="translate(370 270)"><circle cx="42" cy="42" r="42" fill="#8ee0bd"/><text x="27" y="51" fill="#18251f" font-size="28" font-weight="700">2</text><text x="0" y="118" fill="#fff" font-size="22" font-weight="700">See the ruler</text><text x="0" y="150" fill="#c8d5cf" font-size="17">Zero, units and tension.</text></g><g transform="translate(632 270)"><circle cx="42" cy="42" r="42" fill="#8ee0bd"/><text x="27" y="51" fill="#18251f" font-size="28" font-weight="700">3</text><text x="0" y="118" fill="#fff" font-size="22" font-weight="700">Compare like with like</text><text x="0" y="150" fill="#c8d5cf" font-size="17">Same setup and reference.</text></g><g transform="translate(914 270)"><circle cx="42" cy="42" r="42" fill="#8ee0bd"/><text x="27" y="51" fill="#18251f" font-size="28" font-weight="700">4</text><text x="0" y="118" fill="#fff" font-size="22" font-weight="700">Bound the claim</text><text x="0" y="150" fill="#c8d5cf" font-size="17">Fit remains uncertain.</text></g></g>
  <text x="108" y="520" fill="#c8d5cf" font-family="Arial,sans-serif" font-size="20">Independent editorial diagram · One controlled measurement per decision</text>
</svg>
