<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Joyagoo non-cover image search QA</title><style>body{font:14px Arial;margin:12px}button{padding:12px;margin:8px}iframe{width:100%;height:850px;border:1px solid #aaa}</style><h1>Joyagoo real image search QA</h1><p>Load an actual source photograph into the normal image-search input.</p><button data-file="jacket-secondary.jpg">Use jacket photo 2</button><button data-file="lv-last-style.webp">Use last LV style</button><p id="status"></p><iframe src="/zh/catalog/image-search/"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=async()=>{const blob=await(await fetch('/qa/'+b.dataset.file)).blob(),file=new File([blob],b.dataset.file,{type:blob.type}),transfer=new DataTransfer();transfer.items.add(file);const input=document.querySelector('iframe').contentDocument.querySelector('#image-file');input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));document.querySelector('#status').textContent='Loaded '+b.dataset.file;};</script>
