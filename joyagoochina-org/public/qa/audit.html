<!doctype html><meta charset="utf-8"><title>Joyagoo mobile page audit</title><style>body{font:15px Arial;margin:16px}iframe{border:1px solid #aaa;vertical-align:top}table{border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid #ddd}.bad{background:#ffc7c7}#frames{display:flex;gap:10px;flex-wrap:wrap}</style><h1>Joyagoo mobile page audit</h1><p id="status">Preparing…</p><button id="start">Run audit</button><a href="/qa/phone.html">Phone preview</a><table><thead><tr><th>Page</th><th>Screens</th><th>Overflow</th><th>Ready</th></tr></thead><tbody id="results"></tbody></table><div id="frames"></div><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||390),height=+(q.get('height')||844);let results=[];
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;const all=await(await fetch('/qa/routes.json')).json();let cursor=0;const routes=q.has('sample')?all.filter((r,i)=>i%10===0||!/^\/(zh|de|es|fr|it|pl|pt|ro|sv)\//.test(r)):all;
await Promise.all(Array.from({length:6},async()=>{const f=document.createElement('iframe');f.width=width;f.height=height;document.querySelector('#frames').append(f);while(cursor<routes.length){const route=routes[cursor++];await new Promise(resolve=>{let timer=setTimeout(resolve,18000);f.onload=()=>{clearTimeout(timer);setTimeout(resolve,1800);};f.src=route;});try{const d=f.contentDocument,el=d.documentElement,m=d.querySelector('main'),r={route,height:el.scrollHeight,screens:+(el.scrollHeight/height).toFixed(2),overflow:el.scrollWidth>el.clientWidth+1,ready:m?.dataset.mobileReading||'',title:d.title};results.push(r);const tr=document.createElement('tr');if(r.screens>5||r.overflow||r.ready!=='v3')tr.className='bad';tr.innerHTML=`<td><a href="/qa/phone.html?path=${encodeURIComponent(route)}&width=${width}&height=${height}">${route}</a></td><td>${r.screens}</td><td>${r.overflow}</td><td>${r.ready}</td>`;document.querySelector('#results').append(tr);}catch(e){results.push({route,error:String(e)});}document.querySelector('#status').textContent=`${results.length}/${routes.length} checked · ${results.filter(r=>r.screens>5||r.overflow||r.ready!=='v3').length} need attention`;}}));document.querySelector('#status').textContent+=' · COMPLETE';document.querySelector('#frames').remove();};
</script>
