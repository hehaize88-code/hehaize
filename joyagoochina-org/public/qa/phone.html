<!doctype html><meta charset="utf-8"><title>Joyagoo phone preview</title><style>body{margin:12px;background:#ddd;font:14px Arial}iframe{background:white;border:1px solid #aaa}</style><label>Page <input id="path" size="55"></label><button id="go">Open</button><p id="metrics"></p><iframe id="phone"></iframe><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=+(q.get('width')||390);f.height=+(q.get('height')||844);document.querySelector('input').value=q.get('path')||'/';document.querySelector('button').onclick=()=>f.src=document.querySelector('input').value;f.onload=()=>setTimeout(()=>{const d=f.contentDocument;document.querySelector('#metrics').textContent=`${d.documentElement.scrollHeight}px / ${f.height}px = ${(d.documentElement.scrollHeight/f.height).toFixed(2)} screens; width ${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`;},1800);f.src=document.querySelector('input').value;</script>
